
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefa 01 - Controle do Equipamento</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>Controle do Equipamento</h1>
            <p>Controle o estado do equipamento e personalize a interface.</p>
        </header>

        <section id="controle" class="card">

            <div id="status" class="status desligado">
                DESLIGADO
            </div>

            <canvas id="tela" width="600" height="400"></canvas>

            <div class="botoes">
                <button id="toggleBtn">LIGAR</button>
                <button id="resetBtn">RESETAR</button>
            </div>

            <div class="seletor">
                <label for="seletor-cor">Escolha uma cor:</label>
                <input type="color" id="seletor-cor" value="#2563eb">
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
